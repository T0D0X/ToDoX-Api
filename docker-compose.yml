version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-test
    ports:
      - "6379:6379"
    environment:
      REDIS_USER: test_user
      REDIS_USER_PASSWORD: test_password
    command: >
      redis-server
      --user test_user on >test_password ~* +@all

  postgres:
    image: postgres:15
    container_name: postgres-test
    environment:
      POSTGRES_DB: todo_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d todo_test" ]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-migration:
    image: flyway/flyway:9.22-alpine
    command: -url=jdbc:postgresql://postgres:5432/todo_test -user=test_user -password=test_password -schemas=public migrate
    volumes:
      - ./src/main/resources/db/migrations:/flyway/sql

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
volumes:
  grafana_data: