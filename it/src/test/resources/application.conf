db {
    host = "localhost"
    port = "5432"
    name = "todo_test"
    user = "test_user"
    password = "test_password"
    migration-enable = true
}

redis {
    uri = "redis://localhost:6379"
    user = "test_user"
    password = "test_password"
    ttl {
        default-ttl = 5 seconds
        custom-ttl {
            test = 1 seconds
        }
    }
}

jwt {
    secret = "secret"
    issuer = "issuer"
    ttl = 86400
}

auth {
    auth-token = "test"
}